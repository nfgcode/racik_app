name: racik_app
description: "Racik — aplikasi mobile pemindai makanan berbasis kecerdasan buatan."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  camera: ^0.12.1
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  image: ^4.9.2
  image_picker: ^1.2.3
  provider: ^6.1.5+1
  supabase_flutter: ^2.17.2
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Model AI (racik_food.tflite + labels.txt). Lihat assets/models/README.md.
  assets:
    - assets/models/
