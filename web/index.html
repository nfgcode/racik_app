<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Racik — aplikasi pemindai makanan berbasis kecerdasan buatan.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Racik">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Racik</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash sebelum Flutter selesai dimuat; dihapus saat frame pertama tampil. -->
  <style>
    body { margin: 0; background: #f6fbf3; }
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; font-family: Roboto, Arial, sans-serif; color: #42493f;
    }
    #splash img { width: 168px; height: 168px; }
    @media (prefers-color-scheme: dark) {
      body { background: #101510; }
      #splash { color: #c0c9bc; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="Memuat Racik">
    <img src="icons/splash_logo.png" alt="Logo Racik">
    <div>Pemindai makanan berbasis AI</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
